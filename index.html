<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/infocat_transparente.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Deal Desk - Gestión de Mesa de contratos</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#00bd7e">
    <meta name="description" content="Gestión de clientes, proyectos, servicios y cobros.">

    <!-- Instalación en Android / iOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Deal Desk">
    <meta name="apple-touch-icon" href="/icon-256.png">

    <!-- Aplica el tema guardado antes de pintar para evitar un flash de color -->
    <script>
      try {
        // Debe coincidir con THEMES de src/utils/theme.ts
        var THEME_COLORS = {
          verde: '#00bd7e',
          naranja: '#f97316',
          morado: '#7c3aed',
          grises: '#4b5563',
        }
        var savedTheme = localStorage.getItem('pb_theme')
        if (savedTheme && THEME_COLORS[savedTheme]) {
          document.documentElement.dataset.theme = savedTheme
          var themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) themeColor.setAttribute('content', THEME_COLORS[savedTheme])
        }
      } catch (e) {
        /* localStorage no disponible */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
